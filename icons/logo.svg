<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- lolapp : épées croisées dans un hexagone doré, couleurs de l'app -->
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e6d2"/>
      <stop offset="1" stop-color="#c8aa6e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0a0e14"/>
  <!-- Hexagone -->
  <polygon points="256,72 415,164 415,348 256,440 97,348 97,164" fill="#111a26" stroke="url(#or)" stroke-width="14" stroke-linejoin="round"/>
  <!-- Épée 1 (de bas-gauche vers haut-droite) -->
  <g transform="rotate(45 256 256)">
    <polygon points="256,128 270,150 270,300 242,300 242,150" fill="url(#or)"/>
    <rect x="212" y="300" width="88" height="16" rx="6" fill="#c8aa6e"/>
    <rect x="248" y="316" width="16" height="44" rx="4" fill="#785a28"/>
    <circle cx="256" cy="370" r="12" fill="#c8aa6e"/>
  </g>
  <!-- Épée 2 (de bas-droite vers haut-gauche) -->
  <g transform="rotate(-45 256 256)">
    <polygon points="256,128 270,150 270,300 242,300 242,150" fill="url(#or)"/>
    <rect x="212" y="300" width="88" height="16" rx="6" fill="#c8aa6e"/>
    <rect x="248" y="316" width="16" height="44" rx="4" fill="#785a28"/>
    <circle cx="256" cy="370" r="12" fill="#c8aa6e"/>
  </g>
  <!-- Gemme centrale -->
  <circle cx="256" cy="256" r="20" fill="#0ac8b9" stroke="#0a0e14" stroke-width="6"/>
</svg>
